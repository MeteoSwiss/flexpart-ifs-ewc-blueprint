---
- name: Create FLEXPART installation directory
  ansible.builtin.file:
    path: "{{ flexpart_install_dir }}"
    state: directory
    owner: "{{ flexpart_service_user }}"
    group: "{{ flexpart_service_group }}"
    mode: "0755"

- name: Create FLEXPART source directory
  ansible.builtin.file:
    path: "{{ flexpart_install_dir }}/src"
    state: directory
    owner: "{{ flexpart_service_user }}"
    group: "{{ flexpart_service_group }}"
    mode: "0755"

- name: Create FLEXPART configuration directory
  ansible.builtin.file:
    path: "{{ flexpart_config_dir }}"
    state: directory
    owner: root
    group: "{{ flexpart_service_group }}"
    mode: "0750"

- name: Create FLEXPART data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flexpart_service_user }}"
    group: "{{ flexpart_service_group }}"
    mode: "0750"
  loop:
    - "{{ flexpart_data_dir }}"
    - "{{ flexpart_data_dir }}/input"
    - "{{ flexpart_data_dir }}/input/raw"
    - "{{ flexpart_data_dir }}/input/preprocessed"
    - "{{ flexpart_data_dir }}/output"
    - "{{ flexpart_data_dir }}/runs"
    - "{{ flexpart_database_dir }}"

- name: Create FLEXPART log directory
  ansible.builtin.file:
    path: "{{ flexpart_log_dir }}"
    state: directory
    owner: "{{ flexpart_service_user }}"
    group: "{{ flexpart_service_group }}"
    mode: "0750"
