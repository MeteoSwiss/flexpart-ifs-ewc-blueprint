---
apiVersion: communityhub.europeanweather.cloud/v1alpha1
kind: CommunityHubCatalog
spec:
  items:
    flexpart-ifs:
      annotations:
        technology: "Ansible Playbook"
        category: "Data Access,Data Processing,Data Visualization"
        supportLevel: "Community"
        licenseType: "Apache License 2.0"
        others: "Deployable,EWCCLI-compatible"
      displayName: "FLEXPART-IFS Dispersion Workflow"
      name: "flexpart-ifs"
      version: "0.1.0"
      published: false
      summary: >-
        Deploys FLEXPART-IFS on a European Weather Cloud virtual machine using
        IFS forecast data retrieved from ECMWF MARS.
      description: |
        This Ansible Playbook configures a virtual machine in the European
        Weather Cloud to run FLEXPART-IFS. It can be deployed with EWCCLI or
        applied with Ansible to an existing VM.

        The workflow retrieves IFS forecast data from ECMWF MARS, preprocesses
        it with flexprep, runs FLEXPART-IFS, and generates PDF dispersion plots
        with Pyflexplot.

        After deployment, users run simulations from the command line, for
        example:

            flexpart-workflow --latest --step 24 --location BEZ

        Users can also select an explicit forecast cycle for reproducible runs.

        EWCCLI deployments use the ECMWF side and request a public IP. If the
        native MARS client is not already present, this blueprint applies the
        official ECMWF Data Flavour 2.0.2 before installing FLEXPART-IFS.
        MARS credentials and data entitlements remain user-specific.
      home: https://github.com/MeteoSwiss/flexpart-ifs-ewc-blueprint
      sources:
        - https://github.com/MeteoSwiss/flexpart-ifs-ewc-blueprint.git

      ewccli:
        pathToRequirementsFile: requirements.yml
        pathToMainFile: deploy.yml
        publicIP: true
        inputs: []
      license: https://github.com/MeteoSwiss/flexpart-ifs-ewc-blueprint/blob/main/LICENSE
      icon: https://raw.githubusercontent.com/ewcloud/ewc-community-hub/refs/heads/main/logos/EWCLogo.png
      maintainers:
        - name: MeteoSwiss
          url: https://github.com/MeteoSwiss/flexpart-ifs-ewc-blueprint/issues
